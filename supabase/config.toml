# Supabase project configuration for Naz & CO (the project id keeps the old working name).
# Only the settings we manage are declared here; `npx supabase config push`
# applies exactly these to the hosted project and leaves everything else alone.
project_id = "taab-beauty"

[auth]
# Where auth emails (password reset) send people: the live store. When a custom
# domain is added, put it here and in the list below, then run `npx supabase config push`
# (or set the same values in Supabase → Authentication → URL Configuration).
site_url = "https://nazandco.netlify.app"
additional_redirect_urls = ["https://nazandco.netlify.app/**", "http://127.0.0.1:5173/**", "http://localhost:5173/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Customers get a session immediately after signing up. Email confirmation is
# off because the built-in mail service is limited to a few emails per hour;
# turn it on after connecting a real SMTP provider.
enable_confirmations = false
double_confirm_changes = false
