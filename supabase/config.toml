# Supabase project configuration for TAAB.
# Only the settings we manage are declared here; `npx supabase config push`
# applies exactly these to the hosted project and leaves everything else alone.
project_id = "taab-beauty"

[auth]
# Where auth emails (password reset) send people. Keep this on an address you
# control: it stays on local dev until the live domain is registered, then set
# it to the live URL, add "<live URL>/**" below and run `npx supabase config push`.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Customers get a session immediately after signing up. Email confirmation is
# off because the built-in mail service is limited to a few emails per hour;
# turn it on after connecting a real SMTP provider.
enable_confirmations = false
double_confirm_changes = false
